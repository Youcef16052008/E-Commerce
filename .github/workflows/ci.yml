name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgres://placeholder:placeholder@placeholder:5432/biblio"
          BETTER_AUTH_SECRET: "ci-secret-not-real"
          BETTER_AUTH_URL: "http://localhost:3000"
